name: lint, build, release linux binary

on:
  push:
    branches: [main]
    tags: [v*]

env:
  TARGET_PLATFORM: linux-amd64
  BIN_NAME: poll-bot-linux-amd64

jobs:
  lint:
    # go faster its free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  build:
    if: startsWith(github.ref, 'refs/tags/v')

    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: dependencies
        run: go mod download

      # the SPA is compiled into root/api/web/dist and embedded by go:embed,
      # so it has to exist before go build runs
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: build frontend
        working-directory: frontend
        env:
          WEB_ROOT_PATH: ${{ vars.WEB_ROOT_PATH }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: build
        env:
          GOOS: linux
          CGO_ENABLED: 0
          GOARCH: amd64
        run: go build -o main -ldflags "-X 'poll-bot/root/info/version.version=${{ github.ref_name }}' -X 'poll-bot/root/info/version.source=https://api.github.com/repos/michaeljwalla/poll-bot/releases'"

      - name: compress
        run: tar -czvf ${{ env.BIN_NAME }}-${{ github.ref_name }}.tar.gz ./main

      - name: provide build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_PLATFORM }}-latest
          path: ${{ env.BIN_NAME }}-${{ github.ref_name }}.tar.gz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-slim

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TARGET_PLATFORM }}-latest
          path: ${{ env.TARGET_PLATFORM }}

      - name: make release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} ${{ env.TARGET_PLATFORM }} autorelease
          prerelease: true
          files: ${{env.TARGET_PLATFORM}}/*
