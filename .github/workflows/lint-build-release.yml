name: lint, build, release docker binary

on:
  push:
    branches: [main]
    tags: [v*]

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: setup
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
        
  build:
    if: startsWith(github.ref, 'refs/tags/v') 

    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: setup
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
        
      - name: dependencies
        run: go mod tidy
        
      - name: build
        env:
          GOOS: linux
          CGO_ENABLED: 0
          GOARCH: amd64
        run: go build -o main

      - name: provide build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-bin
          path: main
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-slim

    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7

      - name: download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-bin
        
      - name: make release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Linux binary auto-release"
          body: "get with ..."
          prerelease: true
          files: main